<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ペルソナシート</title>
<!--
  ペルソナシートのひな形（A4 縦・1 人 1 ページ）
  使い方: このファイルをコピーし、下の <script id="persona-data"> の中身だけを差し替える。デザイン部分は変えない
  色の役割: 青 = 日常・事実 / モーブ = 困りごと / ゴールド = 代わりの手段の 1 か所だけ / アイボリー = 基本情報
-->
<style>
:root {
  --ink: #2D2A2A;
  --blue: #8EA3B5;
  --blue-deep: #56697C;
  --blue-soft: #EEF2F5;
  --mauve: #B89AA8;
  --mauve-deep: #80606F;
  --mauve-soft: #F6EFF2;
  --gold: #C9A25F;
  --gold-soft: #F8F1E3;
  --ivory: #F7F3EC;
  --cocoa: #6B5346;
  --caption: #7F7D66;
  --line: #E4DFD4;
  --desk: #E9E6E0;
  --desk-ink: #2D2A2A;
  --sans: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", Meiryo, sans-serif;
  --serif: "Hiragino Mincho ProN", "Yu Mincho", YuMincho, "Noto Serif JP", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --desk: #2A2826; --desk-ink: #EDE9E2; }
}
:root[data-theme="dark"] { --desk: #2A2826; --desk-ink: #EDE9E2; }

* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
body { background: var(--desk); color: var(--ink); font-family: var(--sans); }

/* 画面だけに出す操作欄 */
.toolbar {
  max-width: 210mm; margin: 0 auto; padding: 20px 16px 0;
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px;
  color: var(--desk-ink); font-size: 14px; line-height: 1.6;
}
.toolbar h1 { font-family: var(--serif); font-size: 18px; font-weight: bold; }
.toolbar button {
  font: inherit; font-weight: bold; color: #fff; background: var(--blue-deep);
  border: 0; border-radius: 999px; padding: 6px 16px; cursor: pointer;
}
.toolbar .hint { flex-basis: 100%; font-size: 12px; opacity: 0.8; }

.sheets { display: flex; flex-direction: column; align-items: center; gap: 24px; padding: 20px 16px 48px; }

/* 1 枚 = A4。--u が文字の基準サイズで、収まらないときはスクリプトが小さくする */
.sheet {
  --u: 9.5pt;
  width: 210mm; height: 297mm; flex-shrink: 0;
  background: #fff; box-shadow: 0 2px 16px rgba(0, 0, 0, 0.12);
  padding: 10mm 14mm 0;
  display: flex; flex-direction: column; overflow: hidden;
  font-size: var(--u); line-height: 1.45; color: var(--ink);
}
.sheet-body {
  flex: 1; min-height: 0; overflow: hidden;
  display: flex; flex-direction: column; justify-content: space-between; gap: calc(var(--u) * 0.65);
}
.sheet-body > * { flex-shrink: 0; }
.sheet.is-overflow { outline: 3px solid var(--mauve-deep); }

.small { font-size: calc(var(--u) * 0.82); color: var(--caption); line-height: 1.5; }
.small.cocoa { color: var(--cocoa); }
.small.mauve { color: var(--mauve-deep); }
.small.blue { color: var(--blue-deep); }

/* 区画の見出し: 色の点（または ★）＋明朝＋問い */
.heading { display: flex; align-items: baseline; gap: calc(var(--u) * 0.5); margin-bottom: calc(var(--u) * 0.5); white-space: nowrap; }
.heading .mark { font-size: calc(var(--u) * 0.85); color: var(--blue); }
.heading .mark.mauve { color: var(--mauve); }
.heading .mark.gold { color: var(--gold); }
.heading .mark.deep { color: var(--blue-deep); }
.heading .title { font-family: var(--serif); font-size: calc(var(--u) * 1.26); font-weight: bold; color: var(--ink); }
.heading .question { margin-left: calc(var(--u) * 0.35); }

.card { border-radius: calc(var(--u) * 0.95); padding: calc(var(--u) * 0.9); background: var(--ivory); }

/* 見出し部 */
.top-line { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: calc(var(--u) * 0.7); }
.top-line .label { font-size: calc(var(--u) * 0.79); font-weight: bold; color: var(--blue-deep); letter-spacing: 0.16em; }
.header { display: grid; grid-template-columns: calc(var(--u) * 13.4) 1fr; column-gap: 8mm; align-items: start; }
.portrait {
  width: calc(var(--u) * 13.4); height: calc(var(--u) * 13.4); border-radius: calc(var(--u) * 1.47);
  overflow: hidden; display: flex; align-items: center; justify-content: center;
}
.portrait img { width: 100%; height: 100%; object-fit: cover; display: block; }
.portrait .initial { font-family: var(--serif); font-weight: bold; font-size: calc(var(--u) * 6.3); line-height: 1; }
.tone-0 { background: var(--blue-soft); color: var(--blue-deep); }
.tone-1 { background: var(--mauve-soft); color: var(--mauve-deep); }
.tone-2 { background: var(--ivory); color: var(--cocoa); }
.who { padding-top: 2px; }
.name-line { display: flex; align-items: baseline; flex-wrap: wrap; gap: 0 calc(var(--u) * 0.85); margin-top: 0; }
.name { font-family: var(--serif); font-size: calc(var(--u) * 2.6); font-weight: bold; line-height: 1.2; }
.age { font-size: calc(var(--u) * 1.37); color: var(--cocoa); }
.role { font-size: calc(var(--u) * 1.21); font-weight: bold; color: var(--blue-deep); margin-top: calc(var(--u) * 0.15); line-height: 1.4; }
.wish { background: var(--mauve-soft); border-radius: calc(var(--u) * 1.26); padding: calc(var(--u) * 0.85) calc(var(--u) * 1.2); margin-top: calc(var(--u) * 0.9); }
.wish .text { font-family: var(--serif); font-size: calc(var(--u) * 1.42); line-height: 1.4; margin-top: calc(var(--u) * 0.1); }
.chips { display: flex; flex-wrap: wrap; gap: calc(var(--u) * 0.5); margin-top: calc(var(--u) * 0.8); }
.chip {
  font-size: calc(var(--u) * 0.86); line-height: 1.4; color: var(--blue-deep); background: var(--blue-soft);
  border-radius: 999px; padding: calc(var(--u) * 0.4) calc(var(--u) * 0.85);
}
.chip.basis { background: #fff; color: var(--caption); box-shadow: inset 0 0 0 1px var(--line); }

/* 基本情報 */
.profile { display: grid; grid-template-columns: 1.25fr 1.6fr 1.45fr; background: var(--ivory); border-radius: calc(var(--u) * 1.05); padding: calc(var(--u) * 1.05) 0; }
.profile > div { padding: 0 calc(var(--u) * 1.15); }
.profile > div + div { border-left: 0.8pt solid var(--line); }
.profile .small { display: block; margin-bottom: calc(var(--u) * 0.05); }

/* 平日の一日: 時間軸の点と、高さをそろえたカード */
.timeline { position: relative; display: grid; grid-template-columns: repeat(4, 1fr); column-gap: 6pt; height: calc(var(--u) * 0.95); margin-bottom: calc(var(--u) * 0.45); }
.timeline::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; border-top: 1.2pt solid var(--line); }
.timeline span { position: relative; align-self: center; margin-left: 10pt; width: calc(var(--u) * 0.95); height: calc(var(--u) * 0.95); border-radius: 50%; background: var(--blue); box-shadow: 0 0 0 2pt #fff; }
.timeline span.pain { background: var(--mauve); }
.days { display: grid; grid-template-columns: repeat(4, 1fr); column-gap: 6pt; }
.day { display: flex; flex-direction: column; background: var(--blue-soft); }
.day.pain { background: var(--mauve-soft); }
.day .slot { font-family: var(--serif); font-size: calc(var(--u) * 1.16); font-weight: bold; color: var(--blue-deep); margin-right: calc(var(--u) * 0.35); }
.day.pain .slot { color: var(--mauve-deep); }
.day .text { margin-top: calc(var(--u) * 0.2); }
.day .pain-note { margin-top: auto; padding-top: calc(var(--u) * 0.75); }

/* 困っている場面と代わりの手段 */
.pair { display: grid; grid-template-columns: 1.3fr 1fr; column-gap: 6pt; }
.pair .heading { margin-bottom: calc(var(--u) * 0.8); }
.scene { display: grid; grid-template-columns: auto 1fr; gap: calc(var(--u) * 0.4) calc(var(--u) * 0.95); align-content: start; }
.scene .what { font-weight: bold; }
.alternatives { background: var(--gold-soft); }
.alternatives ul { list-style: none; margin-top: calc(var(--u) * 0.35); display: grid; gap: calc(var(--u) * 0.25); }
.alternatives li { padding-left: 1em; text-indent: -1em; }
.alternatives li::before { content: "・"; }

/* 3 つの「不」: 上が困りごと、下の白い箱が解消した後。箱の位置は 3 枚でそろえる */
.fus { display: grid; grid-template-columns: repeat(3, 1fr); column-gap: 6pt; }
.fu { display: flex; flex-direction: column; background: var(--mauve-soft); border-radius: calc(var(--u) * 1.16); }
.fu .kind-line { display: flex; align-items: center; gap: calc(var(--u) * 0.5); }
.fu .kind { font-family: var(--serif); font-size: calc(var(--u) * 1.21); font-weight: bold; color: var(--mauve-deep); background: #fff; border-radius: 999px; padding: calc(var(--u) * 0.3) calc(var(--u) * 0.95); }
.fu .text { margin-top: calc(var(--u) * 0.5); }
.fu .joy { margin-top: auto; background: #fff; border-radius: calc(var(--u) * 0.85); padding: calc(var(--u) * 0.95); }
.fu .text + .joy { margin-top: auto; }
.fu .spacer { flex: 1; min-height: calc(var(--u) * 1.05); }
.fu .joy .value { font-weight: bold; color: var(--blue-deep); margin-top: calc(var(--u) * 0.05); }

/* 分析メモ */
.analysis { background: var(--blue-soft); border-radius: calc(var(--u) * 1.26); padding: calc(var(--u) * 1.26); }
.analysis .heading { margin-bottom: calc(var(--u) * 0.6); }
.analysis .row { display: grid; grid-template-columns: auto 1fr; column-gap: calc(var(--u) * 0.95); align-items: baseline; }
.analysis .job { font-family: var(--serif); font-size: calc(var(--u) * 1.16); font-weight: bold; line-height: 1.5; }
.ratings { display: grid; grid-template-columns: repeat(3, 1fr); column-gap: 6pt; margin: calc(var(--u) * 0.6) 0 6pt; }
.rating { display: grid; grid-template-columns: auto 1fr; column-gap: calc(var(--u) * 0.85); align-items: center; background: #fff; border-radius: calc(var(--u) * 0.95); padding: calc(var(--u) * 0.75); }
.rating .mark { font-family: var(--serif); font-size: calc(var(--u) * 1.79); font-weight: bold; color: var(--blue-deep); line-height: 1; }
.rating .note { font-size: calc(var(--u) * 0.9); line-height: 1.45; }
/* 動き出すまで: 買うきっかけ・買う前のためらい・知る/調べる場所 */
.moves { display: grid; grid-template-columns: repeat(3, 1fr); column-gap: 6pt; margin-bottom: calc(var(--u) * 0.6); }
.move { background: #fff; border-radius: calc(var(--u) * 0.95); padding: calc(var(--u) * 0.75) calc(var(--u) * 0.95); }
.move .value { font-size: calc(var(--u) * 0.92); line-height: 1.45; margin-top: calc(var(--u) * 0.05); }
.offer { display: grid; grid-template-columns: 1fr 1fr; column-gap: calc(var(--u) * 1.4); }
.offer .small { display: block; margin-bottom: calc(var(--u) * 0.2); }
.offer .entry { font-weight: bold; }
.offer .message { font-family: var(--serif); font-weight: bold; color: var(--blue-deep); }

/* 一覧ページ: 全員の比較・狙わない人・確かめ方 */
.overview .sheet-body { justify-content: flex-start; gap: calc(var(--u) * 1.5); }
.ov-title { font-family: var(--serif); font-size: calc(var(--u) * 2.3); font-weight: bold; line-height: 1.3; }
.ov-meta { margin-top: calc(var(--u) * 0.4); }
.ov-table { width: 100%; border-collapse: collapse; font-size: calc(var(--u) * 0.92); line-height: 1.5; }
.ov-table th { text-align: left; font-weight: normal; font-size: calc(var(--u) * 0.8); color: var(--cocoa); padding: 0 calc(var(--u) * 0.6) calc(var(--u) * 0.5); border-bottom: 0.8pt solid var(--line); white-space: nowrap; }
.ov-table td { padding: calc(var(--u) * 0.65) calc(var(--u) * 0.6); border-bottom: 0.6pt solid var(--line); vertical-align: top; }
.ov-table .no { color: var(--blue-deep); font-weight: bold; white-space: nowrap; }
.ov-table .person { font-weight: bold; white-space: nowrap; }
.ov-table .marks { font-family: var(--serif); font-weight: bold; color: var(--blue-deep); white-space: nowrap; letter-spacing: 0.15em; }
.ov-table .basis { color: var(--caption); font-size: calc(var(--u) * 0.82); white-space: nowrap; }
.ov-boxes { display: grid; grid-template-columns: 1fr 1.25fr; column-gap: 6pt; }
.ov-box ul, .ov-box ol { margin-top: calc(var(--u) * 0.6); padding-left: 1.3em; display: grid; gap: calc(var(--u) * 0.45); }
.ov-box.not-target { background: var(--mauve-soft); }
.ov-box.check { background: var(--blue-soft); }
.ov-box .lead { margin-top: calc(var(--u) * 0.5); }

/* フッター（下余白に置く） */
.sheet-foot { height: 12mm; flex-shrink: 0; display: flex; flex-direction: column; justify-content: center; }
.sheet-foot .rule { border-top: 0.6pt solid var(--line); margin-bottom: 4pt; }
.sheet-foot .cols { display: flex; justify-content: space-between; gap: 12px; font-size: 7.8pt; color: var(--caption); }

.empty { color: var(--desk-ink); text-align: center; padding: 48px 16px; font-size: 14px; }

@page { size: A4; margin: 0; }
@media print {
  body { background: #fff; }
  .toolbar { display: none; }
  .sheets { display: block; padding: 0; }
  .sheet { box-shadow: none; outline: none !important; zoom: 1 !important; break-after: page; }
  .sheet:last-child { break-after: auto; }
}
</style>
</head>

<script>
(function () {
  "use strict";

  var CREDIT = "ペルソナシート作成スキル ─ AIワークラボ by ナガイ商店.com";
  var FU_HINTS = { "不便": "手間・時間がかかる", "不安": "わからない・こわい", "不満": "あるけれど物足りない" };
  var FIT_LABELS = [["reach", "届けられる"], ["pay", "払ってくれる"], ["match", "自分に合う"]];
  var MOVE_LABELS = [["trigger", "買うきっかけ"], ["hesitation", "買う前のためらい"], ["channels", "知る・調べる場所"]];
  var CHECK_QUESTIONS = [
    "最初に「なんとかしたい」と思ったのは、いつ、何があったときですか",
    "それまでは、どうやって済ませていましたか",
    "申し込む前に、迷ったことや心配だったことは何ですか",
    "最後の決め手は何でしたか"
  ];
  var OVERVIEW_ROWS = 12;
  var BASE_SIZE = 9.5;
  var MIN_SIZE = 7.6;

  function esc(value) {
    return String(value == null ? "" : value).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function list(value) { return Array.isArray(value) ? value : []; }

  function heading(title, question, tone, mark) {
    return '<div class="heading"><span class="mark ' + (tone || "") + '">' + (mark || "●") + '</span>' +
      '<span class="title">' + esc(title) + '</span>' +
      (question ? '<span class="small question">' + esc(question) + '</span>' : "") + '</div>';
  }

  function portrait(p, index) {
    var initial = esc(String(p.name || "？").trim().charAt(0));
    var tone = "tone-" + (index % 3);
    if (p.photo) {
      return '<div class="portrait ' + tone + '" data-initial="' + initial + '"><img src="' + esc(p.photo) + '" alt=""></div>';
    }
    return '<div class="portrait ' + tone + '"><span class="initial">' + initial + '</span></div>';
  }

  function sheet(p, index, data) {
    var profile = p.profile || {};
    var scene = p.scene || {};
    var fit = p.fit || {};
    var days = list(p.day);
    var tags = list(p.tags).map(function (t) { return '<span class="chip">' + esc(t) + '</span>'; }).join("");
    if (p.basis) { tags += '<span class="chip basis">根拠: ' + esc(p.basis) + '</span>'; }

    var topLeft = "PERSONA " + esc(p.id || String(index + 1).padStart(2, "0"));
    var topRight = (data.business ? esc(data.business) + " ｜ " : "") + "ペルソナシート";
    var created = p.created || data.created || "";
    var note = "架空の人物です。" + (p.photo ? "写真は AI で生成しています。" : "");

    return '<section class="sheet">' +
      '<div class="sheet-body">' +
        '<div>' +
          '<div class="top-line"><span class="label">' + topLeft + '</span><span class="small">' +
            (p.service ? "対象サービス: " + esc(p.service) + " ｜ " : "") + topRight + '</span></div>' +
          '<div class="header">' + portrait(p, index) +
            '<div class="who">' +
              '<span class="small cocoa">名前（仮）</span>' +
              '<div class="name-line"><span class="name">' + esc(p.name) + '</span><span class="age">' + esc(p.age) + ' 歳</span></div>' +
              '<div class="role">' + esc(p.role) + '</div>' +
              '<div class="wish"><span class="small mauve">いちばんの願い</span><div class="text">「' + esc(p.quote) + '」</div></div>' +
              '<div class="chips">' + tags + '</div>' +
            '</div>' +
          '</div>' +
        '</div>' +

        '<div class="profile">' +
          [["家族", profile.family], ["住まい・行動範囲", profile.area], ["暮らし・仕事の規模", profile.scale]].map(function (cell) {
            return '<div><span class="small cocoa">' + cell[0] + '</span>' + esc(cell[1]) + '</div>';
          }).join("") +
        '</div>' +

        '<div>' + heading("平日の一日", "朝から夜まで、どこで何をしているか") +
          '<div class="timeline">' + days.map(function (d) { return '<span class="' + (d.pain ? "pain" : "") + '"></span>'; }).join("") + '</div>' +
          '<div class="days">' + days.map(function (d) {
            return '<div class="card day' + (d.pain ? " pain" : "") + '">' +
              '<div><span class="slot">' + esc(d.slot) + '</span><span class="small">' + esc(d.time) + '</span></div>' +
              '<div class="text">' + esc(d.text) + '</div>' +
              (d.pain ? '<div class="small mauve pain-note">困りごとが起きる時間</div>' : "") +
            '</div>';
          }).join("") + '</div>' +
        '</div>' +

        '<div class="pair">' +
          heading("困っている場面", "いつ・どこで・何が起きて困るのか") +
          heading("いま使っている代わりの手段", "", "gold", "★") +
          '<div class="card scene">' +
            '<span class="small cocoa">いつ</span><span>' + esc(scene.when) + '</span>' +
            '<span class="small cocoa">どこで</span><span>' + esc(scene.where) + '</span>' +
            '<span class="small cocoa">何が</span><span class="what">' + esc(scene.what) + '</span>' +
          '</div>' +
          '<div class="card alternatives"><span class="small cocoa">このサービスがない今、どう済ませているか（我慢する・あきらめるも含む）</span>' +
            '<ul>' + list(p.alternatives).map(function (a) { return '<li>' + esc(a) + '</li>'; }).join("") + '</ul>' +
          '</div>' +
        '</div>' +

        '<div>' + heading("3 つの「不」", "不便・不安・不満と、それが解消したときのうれしさ", "mauve") +
          '<div class="fus">' + list(p.fu).map(function (f) {
            return '<div class="card fu">' +
              '<div class="kind-line"><span class="kind">' + esc(f.kind) + '</span><span class="small">' + esc(FU_HINTS[f.kind] || "") + '</span></div>' +
              '<div class="text">' + esc(f.text) + '</div>' +
              '<div class="spacer"></div>' +
              '<div class="joy"><span class="small blue">解消すると</span><div class="value">' + esc(f.joy) + '</div></div>' +
            '</div>';
          }).join("") + '</div>' +
        '</div>' +

        '<div class="analysis">' + heading("分析メモ", "どのペルソナから狙うかを比べるための欄", "deep") +
          '<div class="row"><span class="small cocoa">本当に片づけたい用事</span><span class="job">' + esc(p.job) + '</span></div>' +
          '<div class="ratings">' + FIT_LABELS.map(function (pair) {
            var item = fit[pair[0]] || {};
            return '<div class="rating"><span class="mark">' + esc(item.mark || "－") + '</span>' +
              '<div><span class="small cocoa">' + pair[1] + '</span><div class="note">' + esc(item.note) + '</div></div></div>';
          }).join("") + '</div>' +
          '<div class="moves">' + MOVE_LABELS.map(function (pair) {
            return '<div class="move"><span class="small cocoa">' + pair[1] + '</span><div class="value">' + esc(p[pair[0]]) + '</div></div>';
          }).join("") + '</div>' +
          '<div class="offer">' +
            '<div><span class="small cocoa">最初にすすめる商品</span><span class="entry">' + esc(p.entry) + '</span></div>' +
            '<div><span class="small cocoa">響く一言</span><span class="message">' + (p.message ? "「" + esc(p.message) + "」" : "") + '</span></div>' +
          '</div>' +
        '</div>' +
      '</div>' +
      footer(note, created) +
    '</section>';
  }

  function footer(note, created) {
    return '<footer class="sheet-foot"><div class="rule"></div><div class="cols">' +
      '<span class="credit">' + CREDIT + '</span>' +
      '<span>' + note + (created ? " ｜ 作成 " + esc(created) : "") + '</span>' +
    '</div></footer>';
  }

  // 一覧ページ。人数が多いときは 12 人ずつに分ける。狙わない人と確かめ方は最初のページだけ
  function overview(data, personas, start, isFirst) {
    var rows = personas.slice(start, start + OVERVIEW_ROWS).map(function (p, i) {
      var fit = p.fit || {};
      var marks = FIT_LABELS.map(function (pair) { return esc((fit[pair[0]] || {}).mark || "－"); }).join("");
      return '<tr><td class="no">' + esc(p.id || String(start + i + 1).padStart(2, "0")) + '</td>' +
        '<td class="person">' + esc(p.name) + '<br><span class="small">' + esc(p.age) + ' 歳</span></td>' +
        '<td>' + esc(p.role) + '</td>' +
        '<td>' + esc(p.core) + '</td>' +
        '<td class="marks">' + marks + '</td>' +
        '<td>' + esc(p.entry) + '</td>' +
        '<td class="basis">' + esc(p.basis) + '</td></tr>';
    }).join("");
    var notTarget = list(data.not_target).map(function (n) {
      return '<li><strong>' + esc(n.who) + '</strong><br><span class="small cocoa">' + esc(n.reason) + '</span></li>';
    }).join("");
    var boxes = isFirst ? '<div class="ov-boxes">' +
      '<div class="card ov-box not-target">' + heading("狙わない人", "", "mauve") +
        (notTarget ? '<ul>' + notTarget + '</ul>' : '<p class="small">（未記入）</p>') + '</div>' +
      '<div class="card ov-box check">' + heading("このペルソナを確かめる", "", "deep") +
        '<p class="small cocoa lead">AI が作ったペルソナは仮説です。近いお客さま 2〜3 人に次のことを聞き、違っていたら直します。</p>' +
        '<ol>' + CHECK_QUESTIONS.map(function (q) { return '<li>' + q + '</li>'; }).join("") + '</ol></div>' +
    '</div>' : "";

    return '<section class="sheet overview">' +
      '<div class="sheet-body">' +
        '<div>' +
          '<div class="top-line"><span class="label">PERSONA SET</span><span class="small">' +
            (data.business ? esc(data.business) + " ｜ " : "") + 'ペルソナシート</span></div>' +
          '<h2 class="ov-title">ペルソナの顔ぶれ</h2>' +
          '<p class="small cocoa ov-meta">' + (data.service ? "対象サービス: " + esc(data.service) + " ｜ " : "") +
            personas.length + ' 人' + (personas.length > OVERVIEW_ROWS ? "（" + (start + 1) + "〜" + Math.min(start + OVERVIEW_ROWS, personas.length) + " 人目）" : "") + '</p>' +
        '</div>' +
        '<table class="ov-table"><thead><tr><th>No.</th><th>名前（仮）</th><th>仕事・立場</th><th>困りごとの核</th><th>届・払・合</th><th>最初にすすめる商品</th><th>根拠</th></tr></thead>' +
          '<tbody>' + rows + '</tbody></table>' +
        boxes +
      '</div>' +
      footer("架空の人物です。", data.created) +
    '</section>';
  }

  // 1 ページに収まるまで、文字の基準サイズを少しずつ下げる。下限でも収まらない枚は枠で知らせる
  function fitSheet(element) {
    var body = element.querySelector(".sheet-body");
    var size = BASE_SIZE;
    element.style.setProperty("--u", size + "pt");
    while (body.scrollHeight > body.clientHeight + 1 && size > MIN_SIZE) {
      size = Math.round((size - 0.1) * 10) / 10;
      element.style.setProperty("--u", size + "pt");
    }
    var isOverflow = body.scrollHeight > body.clientHeight + 1;
    element.classList.toggle("is-overflow", isOverflow);
    element.setAttribute("data-size", String(size));
    return isOverflow;
  }

  // 幅の狭い画面では、紙ごと縮めて横にはみ出さないようにする（印刷には影響しない）
  function fitScreen() {
    var sheets = document.querySelectorAll(".sheet");
    if (!sheets.length) { return; }
    sheets.forEach(function (s) { s.style.zoom = ""; });
    var width = sheets[0].getBoundingClientRect().width;
    var zoom = Math.min(1, (window.innerWidth - 32) / width);
    if (zoom < 1) { sheets.forEach(function (s) { s.style.zoom = String(zoom); }); }
  }

  function fitAll() {
    var sheets = document.querySelectorAll(".sheet");
    sheets.forEach(function (s) { s.style.zoom = ""; });
    var overflow = 0;
    sheets.forEach(function (s) { if (fitSheet(s)) { overflow += 1; } });
    document.body.setAttribute("data-overflow", String(overflow));
    if (overflow > 0) { console.warn("1 ページに収まらないシート: " + overflow + " 枚。文章を短くしてください"); }
    fitScreen();
  }

  var container = document.getElementById("sheets");
  var data;
  try {
    data = JSON.parse(document.getElementById("persona-data").textContent);
  } catch (error) {
    container.innerHTML = '<p class="empty">データの書式に誤りがあり、表示できません（' + esc(error.message) + '）。</p>';
    document.body.setAttribute("data-error", "json");
    return;
  }
  var personas = list(data.personas);
  if (!personas.length) {
    container.innerHTML = '<p class="empty">ペルソナのデータがありません。</p>';
    return;
  }

  document.getElementById("doc-title").textContent = "ペルソナシート" + (data.business ? " ─ " + data.business : "");
  document.getElementById("doc-count").textContent = personas.length + " 人";
  document.title = "ペルソナシート" + (data.business ? "｜" + data.business : "");
  var pages = [];
  if (data.overview !== false) {
    for (var start = 0; start < personas.length; start += OVERVIEW_ROWS) {
      pages.push(overview(data, personas, start, start === 0));
    }
  }
  container.innerHTML = pages.join("") + personas.map(function (p, i) { return sheet(p, i, data); }).join("");

  // 写真が読み込めないときは頭文字に戻す
  container.querySelectorAll(".portrait img").forEach(function (img) {
    img.addEventListener("error", function () {
      var box = img.parentNode;
      box.innerHTML = '<span class="initial">' + box.getAttribute("data-initial") + '</span>';
    });
    img.addEventListener("load", fitAll);
  });

  fitAll();
  if (document.fonts && document.fonts.ready) { document.fonts.ready.then(fitAll); }
  window.addEventListener("resize", fitScreen);
  window.addEventListener("beforeprint", function () { document.querySelectorAll(".sheet").forEach(function (s) { s.style.zoom = ""; }); });
  window.addEventListener("afterprint", fitScreen);
})();
</script>
</body>
</html>
